name: Reference Solution

on:
  push:
    paths:
      - ".github/workflows/reference-solution.yml"
      - "solution/**"
  pull_request:
    paths:
      - ".github/workflows/reference-solution.yml"
      - "solution/**"

jobs:
  validate-reference-solution:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install solution dependencies
        run: python -m pip install -r solution/requirements.txt

      - name: Reproduce the DVC pipeline
        working-directory: solution
        run: dvc repro

      - name: Smoke test the API module
        working-directory: solution
        run: python -c "from src.api import app; print(app.title)"
